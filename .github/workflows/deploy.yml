name: Deploy Dist Folder to Pages
on:
  push:
    branches: ["main"] # Change this to "master" if your repository default branch is named master
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dist folder artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # This tells GitHub to specifically host your dist folder contents
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
