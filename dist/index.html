  (function(l) {
    if (l.search[0] === '/' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&') 
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + (decoded ? '#' + decoded : '')
      );
    }

  <script type="text/javascript">
  // Force React Router to see the root path instead of the GitHub subfolder
  (function() {
    const repoName = '/' + window.location.pathname.split('/')[1] + '/';
    if (window.location.pathname.startsWith(repoName)) {
      const cleanPath = window.location.pathname.replace(repoName, '/');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  })();
</script>
  <script type="text/javascript">
  // Invisible route virtualization for React Router
  (function() {
    const repoName = '/examvector';
    if (window.location.pathname.startsWith(repoName)) {
      const internalPath = window.location.pathname.replace(repoName, '') || '/';
      // Safely trick React Router's internal path parser without changing the visible URL bar
      try {
        Object.defineProperty(window.location, 'pathname', {
          get: function() { return internalPath; },
          configurable: true
        });
      } catch (e) {
        // Fallback if browser blocks direct redefinition
        window.history.replaceState(null, '', internalPath + window.location.search + window.location.hash);
      }
    }
  })();
</script>
